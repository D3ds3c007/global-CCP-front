<div class="input-field">
  <label class="input-label" [for]="id()">{{ label() }}</label>
  <input
    nz-input
    class="input-control"
    [id]="id()"
    type="email"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [value]="value"
    [disabled]="isDisabled"
    [class.input-control--invalid]="invalid()"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />
</div>
