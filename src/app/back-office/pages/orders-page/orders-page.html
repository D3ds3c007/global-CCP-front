<section class="page" *ngIf="vm$ | async as vm">
  <h1 class="title">Orders</h1>
  <div class="card" *ngIf="noShopMessage">{{ noShopMessage }}</div>
  <div class="card" *ngIf="loading">Loading orders...</div>
  <div class="card" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="grid">
    <div class="left-rail">
      <div class="filters-card">
        <app-orders-filters [query]="vm.query" (queryChange)="setQuery($event)"></app-orders-filters>
      </div>

      <div class="card list-card">
        <app-orders-table
          [orders]="vm.orders"
          [selectedId]="(selectedId$ | async)"
          (selectOrder)="select($event)"
        ></app-orders-table>
      </div>
    </div>
  </div>

  <div class="dialog-overlay" *ngIf="isDetailDialogOpen && vm.selectedOrder" (click)="closeDetail()">
    <div class="dialog-shell" (click)="$event.stopPropagation()">
      <div class="card dialog-card">
        <app-order-detail
          [order]="vm.selectedOrder"
          [nextStatus]="(nextStatus$ | async)"
          [canCancel]="(canCancel$ | async) ?? false"
          (advance)="advance($event)"
          (cancel)="cancel($event)"
        ></app-order-detail>
      </div>
    </div>
  </div>
</section>
