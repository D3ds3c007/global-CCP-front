<section class="page" *ngIf="vm$ | async as vm">
  <div class="page-head">
    <div class="page-copy">
      <h1 class="title">My Shops</h1>
      <p class="subtitle">Open an existing shop or create a new workspace for your team.</p>
    </div>

    <button class="create-shop-cta" type="button" (click)="openCreate()">
      <span class="create-shop-cta__icon">+</span>
      <span class="create-shop-cta__copy">
        <span class="create-shop-cta__label">Create shop</span>
        <span class="create-shop-cta__meta">Launch setup dialog</span>
      </span>
    </button>
  </div>

  <div class="list">
    <app-shop-row *ngFor="let s of vm.shops" [shop]="$any(s)"></app-shop-row>
  </div>

  <app-shop-dialog
    *ngIf="dialogOpen"
    mode="create"
    [categories]="$any(vm.categories)"
    (cancel)="closeDialog()"
    (created)="closeDialog()"
  ></app-shop-dialog>
</section>
