<section class="page" *ngIf="vm$ | async as vm">
  <div class="page-head">
    <h1 class="title">My Shops</h1>
  </div>

  <div class="list">
    <app-shop-row *ngFor="let s of vm.shops" [shop]="$any(s)"></app-shop-row>
  </div>

  <button class="fab" type="button" (click)="openCreate()">+</button>

  <app-shop-dialog
    *ngIf="dialogOpen"
    mode="create"
    [categories]="$any(vm.categories)"
    (cancel)="closeDialog()"
    (created)="closeDialog()"
  ></app-shop-dialog>
</section>
