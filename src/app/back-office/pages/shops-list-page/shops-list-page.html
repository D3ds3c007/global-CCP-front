<section class="page">
  <h1 class="title">LISTE SHOP</h1>

  <div class="list" *ngIf="shops$ | async as shops; else loading">
    <app-shop-row *ngFor="let s of shops" [shop]="s"></app-shop-row>
  </div>

  <ng-template #loading>
    <div class="loading">Loading...</div>
  </ng-template>
</section>
