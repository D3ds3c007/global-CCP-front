<section class="page" *ngIf="vm$ | async as vm">
    <div class="page-head">
        <h1 class="title">List shop</h1>
  </div>
  <div class="list">
    <app-shop-row *ngFor="let s of vm.shops" [shop]="s"></app-shop-row>
  </div>

  <button class="fab" type="button" (click)="openCreate()">+</button>

  <app-shop-dialog
    *ngIf="dialogOpen"
    mode="create"
    [categories]="vm.categories"
    (cancel)="closeDialog()"
    (save)="onSave($event)"
  ></app-shop-dialog>
</section>
