<section class="page" *ngIf="vm$ | async as vm">
  <div class="header">
    <div>
      <h1>Products</h1>
      <p>Create, review and manage your catalog with the same Back Office dashboard look.</p>
    </div>

    <button class="create-product-panel" type="button" (click)="openCreate()" title="Add">
      <span class="create-product-panel__spark">+</span>
      <span class="create-product-panel__body">
        <span class="create-product-panel__title">Add product</span>
        <span class="create-product-panel__text">Open the creation dialog.</span>
      </span>
    </button>
  </div>

  <div class="empty" *ngIf="noShopMessage">{{ noShopMessage }}</div>
  <div class="empty" *ngIf="loading">Loading products...</div>
  <div class="empty" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="surface">
    <app-products-filters
      [categories]="vm.categories"
      [query]="vm.query"
      (queryChange)="setQuery($event)"
    ></app-products-filters>

    <!-- <div class="cards">
      <app-product-card
        *ngFor="let p of vm.products; trackBy: trackByProductId"
        [product]="p"
        [actionsDisabled]="isProductBusy(p)"
        (view)="openDetails($event)"
        (edit)="openEdit($event)"
        (remove)="onDelete($event)"
        (toggle)="onToggle($event)"
      ></app-product-card>
    </div> -->
  </div>

  <h3 class="section-title"></h3>
  <div class="surface surface--table">
    <app-products-table
      [products]="vm.products"
      [disabledIds]="busyProductIds"
      (view)="openDetails($event)"
      (edit)="openEdit($event)"
      (remove)="onDelete($event)"
      (toggle)="onToggle($event)"
    ></app-products-table>
  </div>

  <app-product-dialog
    *ngIf="dialogOpen"
    [mode]="dialogMode"
    [product]="editing"
    [categories]="vm.categories"
    [submitting]="dialogSubmitting"
    [loading]="dialogLoading"
    [errorMessage]="dialogErrorMessage"
    (cancel)="closeDialog()"
    (save)="onDialogSave($event)"
    (editFromDetails)="onDialogEditFromDetails($event)"
  ></app-product-dialog>
</section>
