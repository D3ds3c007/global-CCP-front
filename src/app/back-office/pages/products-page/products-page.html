<section class="page" *ngIf="vm$ | async as vm">
  <div class="empty" *ngIf="noShopMessage">{{ noShopMessage }}</div>
  <div class="empty" *ngIf="loading">Chargement des produits...</div>
  <div class="empty" *ngIf="errorMessage">{{ errorMessage }}</div>

  <app-products-filters
    [categories]="vm.categories"
    [query]="vm.query"
    (queryChange)="setQuery($event)"
  ></app-products-filters>

  <div class="cards">
    <app-product-card
      *ngFor="let p of vm.products; trackBy: trackByProductId"
      [product]="p"
      [actionsDisabled]="isProductBusy(p)"
      (view)="openDetails($event)"
      (edit)="openEdit($event)"
      (remove)="onDelete($event)"
      (toggle)="onToggle($event)"
    ></app-product-card>
  </div>

  <h3 class="section-title">Liste (table)</h3>
  <app-products-table
    [products]="vm.products"
    [disabledIds]="busyProductIds"
    (view)="openDetails($event)"
    (edit)="openEdit($event)"
    (remove)="onDelete($event)"
    (toggle)="onToggle($event)"
  ></app-products-table>

  <button class="fab" type="button" (click)="openCreate()" title="Ajouter">
    +
  </button>

  <app-product-dialog
    *ngIf="dialogOpen"
    [mode]="dialogMode"
    [product]="editing"
    [categories]="vm.categories"
    [submitting]="dialogSubmitting"
    [loading]="dialogLoading"
    [errorMessage]="dialogErrorMessage"
    (cancel)="closeDialog()"
    (save)="onDialogSave($event)"
    (editFromDetails)="onDialogEditFromDetails($event)"
  ></app-product-dialog>
</section>
