<div *ngIf="points.length; else empty" class="chart">
  <svg [attr.viewBox]="'0 0 ' + w + ' ' + h" preserveAspectRatio="none" (mouseleave)="hideTooltip()">
    <defs>
      <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stop-color="#7ee787" stop-opacity="0.45"></stop>
        <stop offset="100%" stop-color="#7ee787" stop-opacity="0.05"></stop>
      </linearGradient>
    </defs>

    <g class="grid">
      <line *ngFor="let t of [0,1,2,3,4]" [attr.x1]="pad" [attr.x2]="w-pad"
            [attr.y1]="pad + (t*(h-pad*2))/4" [attr.y2]="pad + (t*(h-pad*2))/4"></line>
    </g>

    <path [attr.d]="areaPath" fill="url(#g)"></path>
    <polyline [attr.points]="polyline" fill="none" stroke="#22c55e" stroke-width="2"></polyline>

    <g class="points">
      <g *ngFor="let p of points; let i=index" class="point" (mouseenter)="showTooltip(i)">
        <circle
          [attr.cx]="x(i)"
          [attr.cy]="y(p.valueK)"
          [attr.r]="hoveredIndex === i ? 5 : 4"
          [class.is-active]="hoveredIndex === i"
        ></circle>
        <circle
          class="hit"
          [attr.cx]="x(i)"
          [attr.cy]="y(p.valueK)"
          r="12"
          fill="transparent"
        ></circle>
      </g>
    </g>

    <g *ngIf="hoveredIndex !== null" class="tooltip">
      <line
        class="guide"
        [attr.x1]="x(hoveredIndex)"
        [attr.x2]="x(hoveredIndex)"
        [attr.y1]="pad"
        [attr.y2]="h - pad"
      ></line>
      <rect
        [attr.x]="tooltipX(hoveredIndex) - 54"
        [attr.y]="tooltipY(hoveredIndex) - 20"
        width="108"
        height="34"
        rx="10"
      ></rect>
      <text class="tooltip-label" [attr.x]="tooltipX(hoveredIndex)" [attr.y]="tooltipY(hoveredIndex) - 7" text-anchor="middle">
        {{ tooltipLabel(points[hoveredIndex]) }}
      </text>
      <text class="tooltip-value" [attr.x]="tooltipX(hoveredIndex)" [attr.y]="tooltipY(hoveredIndex) + 8" text-anchor="middle">
        {{ tooltipValue(points[hoveredIndex]) }}
      </text>
    </g>

    <g class="labels">
      <text *ngFor="let p of points; let i=index" [attr.x]="x(i)" [attr.y]="h-10" text-anchor="middle">
        {{ labelFor(p) }}
      </text>
    </g>
  </svg>
</div>

<ng-template #empty>
  <div class="empty">No revenue data.</div>
</ng-template>
