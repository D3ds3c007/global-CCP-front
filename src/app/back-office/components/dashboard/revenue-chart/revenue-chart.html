<div *ngIf="points.length; else empty" class="chart">
  <svg [attr.viewBox]="'0 0 ' + w + ' ' + h" preserveAspectRatio="none" (mouseleave)="hideTooltip()">
    <defs>
      <linearGradient [attr.id]="gradientId" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#22c55e"></stop>
        <stop offset="100%" stop-color="#0ea5e9"></stop>
      </linearGradient>
    </defs>

    <g class="grid">
      <ng-container *ngFor="let tick of yTicks">
        <line
          [attr.x1]="chartLeft"
          [attr.x2]="chartRight"
          [attr.y1]="tick.y"
          [attr.y2]="tick.y"
        ></line>
        <text
          class="tick-label"
          [attr.x]="chartLeft - 10"
          [attr.y]="tick.y + 4"
          text-anchor="end"
        >
          {{ tick.label }}
        </text>
      </ng-container>
    </g>

    <g class="bars">
      <g *ngFor="let bar of bars; let i = index" class="bar-group" (mouseenter)="showTooltip(i)">
        <rect
          class="bar"
          [class.is-active]="hoveredIndex === i"
          [attr.x]="bar.x"
          [attr.y]="bar.y"
          [attr.width]="bar.width"
          [attr.height]="bar.height"
          rx="10"
          ry="10"
          [attr.fill]="'url(#' + gradientId + ')'"
        >
          <title>{{ barTitle(points[i]) }}</title>
        </rect>
      </g>
    </g>

    <g *ngIf="hoveredIndex !== null" class="tooltip">
      <line
        class="guide"
        [attr.x1]="bars[hoveredIndex].x + bars[hoveredIndex].width / 2"
        [attr.x2]="bars[hoveredIndex].x + bars[hoveredIndex].width / 2"
        [attr.y1]="chartTop"
        [attr.y2]="chartBottom"
      ></line>
      <rect
        [attr.x]="tooltipX(hoveredIndex) - 58"
        [attr.y]="tooltipY(hoveredIndex) - 24"
        width="116"
        height="40"
        rx="12"
      ></rect>
      <text class="tooltip-label" [attr.x]="tooltipX(hoveredIndex)" [attr.y]="tooltipY(hoveredIndex) - 7" text-anchor="middle">
        {{ tooltipLabel(points[hoveredIndex]) }}
      </text>
      <text class="tooltip-value" [attr.x]="tooltipX(hoveredIndex)" [attr.y]="tooltipY(hoveredIndex) + 10" text-anchor="middle">
        {{ tooltipValue(points[hoveredIndex]) }}
      </text>
    </g>

    <g class="labels">
      <text
        *ngFor="let bar of bars"
        [attr.x]="bar.x + bar.width / 2"
        [attr.y]="h - 14"
        text-anchor="middle"
      >
        {{ bar.label }}
      </text>
    </g>
  </svg>
</div>

<ng-template #empty>
  <div class="empty">No revenue data.</div>
</ng-template>
