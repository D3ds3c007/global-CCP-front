<div class="kpi">
  <div class="value">
    <span class="pct">{{ data.percent }}%</span>

    <svg *ngIf="data.trend === 'up'" class="trend" width="18" height="18" viewBox="0 0 24 24">
      <path d="M7 17L17 7" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
      <path d="M10 7h7v7" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="subtitle">{{ data.subtitle }}</div>

  <a class="link" href="javascript:void(0)">{{ data.linkText }}</a>
</div>
