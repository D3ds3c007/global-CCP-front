<div class="table-wrap">
  <div class="table-head" *ngIf="customers.length">
    <span>Customer</span>
    <span>Contact</span>
    <span class="right">Orders</span>
    <span>Last order</span>
  </div>

  <div class="list" *ngIf="customers.length; else empty">
    <div
      class="row"
      *ngFor="let c of customers; trackBy: trackById"
      [class.ACTIVE]="c.id === selectedId"
      (click)="select.emit(c.id)"
    >
      <div class="cell cell--customer">
        <div class="meta">
          <div class="name">{{ c.fullName }}</div>
          <div class="subline">{{ c.address || 'No address provided' }}</div>
        </div>
      </div>

      <div class="cell cell--contact">
        <div class="contact">{{ c.email || 'No email provided' }}</div>
        <div class="contact" *ngIf="c.phone">{{ c.phone }}</div>
      </div>

      <div class="cell cell--orders right">
        <span class="pill">{{ c.totalOrders }}</span>
      </div>

      <div class="cell cell--date">
        <span class="date-value">{{ c.lastOrderDate ? (c.lastOrderDate | date: 'mediumDate') : 'No orders yet' }}</span>
      </div>
    </div>
  </div>
</div>

<ng-template #empty>
  <div class="empty">No customers yet.</div>
</ng-template>
