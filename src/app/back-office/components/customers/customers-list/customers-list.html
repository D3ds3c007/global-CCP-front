<div class="list" *ngIf="customers.length; else empty">
  <div
    class="row"
    *ngFor="let c of customers; trackBy: trackById"
    [class.ACTIVE]="c.id === selectedId"
    (click)="select.emit(c.id)"
  >
    <div class="content">
      <div class="meta">
        <div class="name">{{ c.fullName }}</div>
        <div class="contact">{{ c.email || 'No email provided' }}</div>
        <div class="contact" *ngIf="c.phone">{{ c.phone }}</div>
        <div class="contact" *ngIf="c.address">{{ c.address }}</div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="label">Orders</span>
          <span class="value">{{ c.totalOrders }}</span>
        </div>
        <div class="stat" *ngIf="c.lastOrderDate">
          <span class="label">Last order</span>
          <span class="value">{{ c.lastOrderDate | date: 'mediumDate' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #empty>
  <div class="empty">No customers yet.</div>
</ng-template>
