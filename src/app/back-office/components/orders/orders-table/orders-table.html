<div class="list" *ngIf="orders.length; else empty">
  <button
    class="order-card"
    type="button"
    *ngFor="let o of orders; trackBy: trackByOrderId"
    (click)="selectOrder.emit(o.id)"
    [class.ACTIVE]="o.id === selectedId"
  >
    <div class="order-card__top">
      <div class="mono order-card__id">{{ o.id }}</div>
      <span class="pill" [class]="o.status">{{ o.status }}</span>
    </div>

    <div class="order-card__summary">
      <div class="order-card__buyer">{{ o.buyer.fullName }}</div>
      <div class="order-card__date">{{ o.createdAt | date:'short' }}</div>
      <div class="order-card__total">{{ o.total | currency:'USD' }}</div>
    </div>
  </button>
</div>

<ng-template #empty>
  <div class="empty">No orders.</div>
</ng-template>
