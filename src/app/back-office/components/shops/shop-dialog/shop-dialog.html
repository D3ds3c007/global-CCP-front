<div class="overlay" (click)="onBackdropClick()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="head">
      <h3 class="title">Create shop</h3>
      <button class="x" type="button" (click)="cancel.emit()" [disabled]="submitting" aria-label="Close dialog">&times;</button>
    </div>

    <div class="alert" *ngIf="submitError">{{ submitError }}</div>

    <form class="dialog-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="img-block">
        <div class="preview preview--product" [class.preview--empty]="!(previewUrl || defaultLogoUrl)">
          <img *ngIf="previewUrl || defaultLogoUrl; else emptyPreview" [src]="previewUrl || defaultLogoUrl" alt="Shop logo preview" />
        </div>

        <div class="img-actions">
          <div
            class="dropzone"
            [class.drag-over]="isDragOver"
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave($event)"
            (drop)="onDrop($event)"
          >
            <p class="dropzone-title">Add shop logo</p>
            <p class="dropzone-hint">PNG, JPG, WEBP | Max 2MB</p>

            <div class="dropzone-actions">
              <label class="file-btn" [class.is-disabled]="submitting">
                {{ hasCustomLogo ? 'Replace logo' : 'Upload logo' }}
                <input type="file" accept="image/*" (change)="onPickFile($event)" [disabled]="submitting" hidden />
              </label>

              <button type="button" class="btn ghost" (click)="onRemoveLogo()" [disabled]="!hasCustomLogo || submitting">
                Remove logo
              </button>
            </div>

            <p class="file-meta" *ngIf="selectedLogoFileName">
              {{ selectedLogoFileName }}
            </p>
          </div>
        </div>
      </div>
      <ng-template #emptyPreview>
        <div class="preview-placeholder">No image selected</div>
      </ng-template>

      <div class="grid">
        <label class="field">
          <span>Name</span>
          <input formControlName="name" [disabled]="submitting" />
        </label>

        <label class="field">
          <span>Category</span>
          <select formControlName="categoryId" [disabled]="submitting">
            <option *ngFor="let c of categories" [value]="c._id">{{ c.name }}</option>
          </select>
        </label>

        <label class="field field--full">
          <span>Description</span>
          <textarea formControlName="description" rows="4" [disabled]="submitting"></textarea>
        </label>

        <label class="field">
          <span>Opening Hours</span>
          <input formControlName="openingHours" placeholder="Mon-Sat 09:00-18:00" [disabled]="submitting" />
        </label>
      </div>

      <div class="grid" formGroupName="contact">
        <label class="field">
          <span>Contact Phone</span>
          <input formControlName="phone" [disabled]="submitting" />
        </label>

        <label class="field">
          <span>Contact Email</span>
          <input formControlName="email" type="email" [disabled]="submitting" />
        </label>

        <label class="field field--full">
          <span>Contact Address</span>
          <input formControlName="address" [disabled]="submitting" />
        </label>
      </div>

      <div class="grid" formGroupName="socials">
        <label class="field">
          <span>Facebook</span>
          <input formControlName="facebook" [disabled]="submitting" />
        </label>

        <label class="field">
          <span>Instagram</span>
          <input formControlName="instagram" [disabled]="submitting" />
        </label>

        <label class="field">
          <span>Website</span>
          <input formControlName="website" [disabled]="submitting" />
        </label>
      </div>

      <div class="actions">
        <button type="button" class="btn ghost" (click)="cancel.emit()" [disabled]="submitting">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="submitting">
          {{ submitting ? 'Submitting...' : 'Create' }}
        </button>
      </div>
    </form>
  </div>
</div>
