<aside class="sidebar" [class.is-collapsed]="collapsed">
  <div class="card">
    <!-- Top -->
    <div class="top">
      <div class="brand">
        <div class="logo"></div>
        <div class="title" *ngIf="!collapsed">Golden Market</div>
      </div>

      <div class="search" *ngIf="!collapsed && (selectedShop$ | async)">
        <span class="mi">search</span>
        <input [(ngModel)]="search" placeholder="Search" />
      </div>

      <ng-container *ngIf="selectedShop$ | async as selectedShop; else noShopContext">
        <div class="shop-context" *ngIf="!collapsed">
          <div class="shop-context__label">Selected Shop</div>
          <div class="shop-context__name">{{ selectedShop.name }}</div>
        </div>

        <button class="item item-button back-action" type="button" (click)="backToMyShops()">
          <span class="mi">arrow_back</span>
          <span class="label" *ngIf="!collapsed">Back to My Shops</span>
        </button>

        <nav class="nav">
          <a
            class="item"
            *ngFor="let item of getShopNav(selectedShop)"
            [routerLink]="item.route"
            routerLinkActive="ACTIVE"
          >
            <span class="mi">{{ item.icon }}</span>
            <span class="label" *ngIf="!collapsed">{{ item.label }}</span>
          </a>
        </nav>
      </ng-container>

      <ng-template #noShopContext>
        <nav class="nav">
          <a
            class="item"
            *ngFor="let item of getBaseNav()"
            [routerLink]="item.route"
            routerLinkActive="ACTIVE"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <span class="mi">{{ item.icon }}</span>
            <span class="label" *ngIf="!collapsed">{{ item.label }}</span>
          </a>
        </nav>
      </ng-template>
    </div>

    <!-- Bottom -->
    <div class="bottom">
      <div class="user" *ngIf="!collapsed && (user$ | async) as user">
        <!-- <img class="avatar" [src]="user.avatarUrl" alt="avatar" /> -->
        <div class="meta">
          <div class="name">{{ user.fullName }}</div>
          <div class="badge">{{ user.role }}</div>
        </div>
      </div>

      <button class="logout" (click)="onLogout()">
        <span class="mi">logout</span>
        <span *ngIf="!collapsed">Log out</span>
      </button>

      <button class="collapse-btn" (click)="toggle()" aria-label="toggle sidebar">
        <span class="mi">{{ collapsed ? 'chevron_right' : 'chevron_left' }}</span>
      </button>
    </div>
  </div>
</aside>
