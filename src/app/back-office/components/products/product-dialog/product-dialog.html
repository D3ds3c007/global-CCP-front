<div class="overlay" (click)="onBackdropClick()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="head">
      <h3>{{ mode === 'create' ? 'Créer un produit' : 'Modifier le produit' }}</h3>
      <button class="x" type="button" (click)="cancel.emit()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- IMAGE: upload + preview + url -->
      <div class="img-block">
        <div class="preview">
          <img [src]="previewUrl || form.controls.imageUrl.value" alt="preview" />
        </div>

        <div class="img-actions">
          <label class="file-btn">
            Upload image
            <input type="file" accept="image/*" (change)="onPickFile($event)" hidden />
          </label>

          <div class="or">ou</div>

          <label class="field">
            <span>Image URL</span>
            <input
              formControlName="imageUrl"
              (input)="previewUrl = form.controls.imageUrl.value"
            />
          </label>
        </div>
      </div>

      <!-- FORM GRID -->
      <div class="grid">
        <label class="field">
          <span>Nom</span>
          <input formControlName="name" />
        </label>

        <label class="field">
          <span>Catégorie</span>
          <select formControlName="categoryId">
            <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
          </select>
        </label>

        <label class="field">
          <span>Status</span>
          <select formControlName="status">
            <option value="active">active</option>
            <option value="inactive">inactive</option>
          </select>
        </label>

        <label class="field">
          <span>Prix</span>
          <input type="number" formControlName="price" />
        </label>

        <label class="field">
          <span>Stock</span>
          <input type="number" formControlName="stock" />
        </label>
      </div>

      <div class="actions">
        <button type="button" class="btn ghost" (click)="cancel.emit()">Annuler</button>
        <button type="submit" class="btn primary">
          {{ mode === 'create' ? 'Créer' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
