<div class="overlay" (click)="onBackdropClick()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="head">
      <h3>{{ title }}</h3>
      <button class="x" type="button" (click)="cancel.emit()" [disabled]="submitting">×</button>
    </div>

    <div class="alert" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="alert info" *ngIf="loading">Chargement...</div>

    <ng-container *ngIf="isDetailsMode; else editForm">
      <div class="details" *ngIf="product as p">
        <div class="details-gallery">
          <div class="details-main">
            <img [src]="pictureUrl + (detailsActiveImage || p.imageUrl)" [alt]="p.name" />
          </div>
          <div class="thumbs" *ngIf="(p.images.length || 0) > 1">
            <button
              type="button"
              class="thumb-btn"
              *ngFor="let img of p.images"
              (click)="selectDetailsImage(img)"
              [class.active]="(detailsActiveImage || p.imageUrl) === img"
            >
              <img [src]="pictureUrl + img" [alt]="p.name" />
            </button>
          </div>
        </div>

        <div class="details-grid">
          <div><span>Nom</span><strong>{{ p.name }}</strong></div>
          <div><span>Catégorie</span><strong>{{ p.categoryName || p.categoryId }}</strong></div>
          <div><span>Status</span><strong>{{ p.status }}</strong></div>
          <div><span>Prix</span><strong>{{ p.price | number:'1.0-2' }}</strong></div>
          <div><span>Stock</span><strong>{{ p.stock }}</strong></div>
        </div>

        <div class="field">
          <span>Description</span>
          <div class="details-desc">{{ p.description || 'Aucune description' }}</div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn ghost" (click)="cancel.emit()">Fermer</button>
        <button type="button" class="btn primary" (click)="openEditFromDetails()" *ngIf="product">
          Modifier
        </button>
      </div>
    </ng-container>

    <ng-template #editForm>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="img-section">
          <div class="img-toolbar">
            <label class="file-btn" [class.disabled]="submitting">
              Ajouter images
              <input
                type="file"
                accept="image/*"
                multiple
                [disabled]="submitting"
                (change)="onPickFiles($event)"
                hidden
              />
            </label>
          </div>

          <div class="thumbs-edit" *ngIf="retainedImages.length || newImages.length; else noImages">
            <div class="thumb-card" *ngFor="let img of retainedImages; index as i">
              <img [src]="pictureUrl + img" alt="existing image" />
              <button type="button" class="remove-thumb" (click)="removeExistingImage(i)" [disabled]="submitting">×</button>
            </div>
            <div class="thumb-card" *ngFor="let item of newImages; index as i">
              <img [src]=" item.previewUrl" [alt]="item.name" />
              <button type="button" class="remove-thumb" (click)="removeNewImage(i)" [disabled]="submitting">×</button>
            </div>
          </div>
          <ng-template #noImages>
            <div class="empty-thumb">Aucune image sélectionnée</div>
          </ng-template>
        </div>

        <div class="grid">
          <label class="field">
            <span>Nom</span>
            <input formControlName="name" [disabled]="submitting" />
          </label>

          <label class="field">
            <span>Catégorie</span>
            <select formControlName="categoryId" [disabled]="submitting">
              <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
            </select>
          </label>

          <label class="field">
            <span>Status</span>
            <select formControlName="status" [disabled]="submitting">
              <option value="ACTIVE">ACTIVE</option>
              <option value="INACTIVE">INACTIVE</option>
            </select>
          </label>

          <label class="field">
            <span>Prix</span>
            <input type="number" formControlName="price" [disabled]="submitting" />
          </label>

          <label class="field">
            <span>Stock</span>
            <input type="number" formControlName="stock" [disabled]="submitting" />
          </label>

          <label class="field field--full">
            <span>Description</span>
            <textarea formControlName="description" rows="4" [disabled]="submitting"></textarea>
          </label>
        </div>

        <div class="actions">
          <button type="button" class="btn ghost" (click)="cancel.emit()" [disabled]="submitting">Annuler</button>
          <button type="submit" class="btn primary" [disabled]="submitting || loading">
            {{ submitting ? 'Envoi...' : (mode === 'create' ? 'Créer' : 'Enregistrer') }}
          </button>
        </div>
      </form>
    </ng-template>
  </div>
</div>
