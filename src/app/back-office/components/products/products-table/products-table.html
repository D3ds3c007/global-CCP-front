<div class="table-wrap">
  <table *ngIf="products.length; else empty">
    <thead>
      <tr>
        <th>Image</th>
        <th>Name</th>
        <th class="right">Price</th>
        <th class="right">Stock</th>
        <th>Status</th>
        <th class="right">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of products; trackBy: trackByProductId" (click)="view.emit(p)">
        <td><img class="thumb" [src]="pictureUrl + p.imageUrl" [alt]="p.name" /></td>
        <td class="name">{{ p.name }}</td>
        <td class="right">{{ p.price === 0 ? 'FREE' : (p.price | currency:'USD') }}</td>
        <td class="right">{{ p.stock }}</td>
        <td>
          <span class="pill" [class.on]="p.status==='ACTIVE'">{{ p.status }}</span>
        </td>
        <td class="right actions">
          <button type="button" [disabled]="isDisabled(p)" (click)="$event.stopPropagation(); toggle.emit(p)">
            {{ p.status === 'ACTIVE' ? 'deactivate' : 'activate' }}
          </button>
          <button type="button" [disabled]="isDisabled(p)" (click)="$event.stopPropagation(); edit.emit(p)">edit</button>
          <button type="button" class="danger" [disabled]="isDisabled(p)" (click)="$event.stopPropagation(); remove.emit(p)">delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #empty>
    <div class="empty">No products.</div>
  </ng-template>
</div>
