<section class="page">
  <header class="top">
    <h1 class="product-name">{{ product.name }}</h1>
    <a class="store-link" routerLink="/manufacturers">
        <div class="store-name">{{ product.storeName }}</div>
    </a>
  </header>

  <div class="layout">
    <!-- 2/3 : Carousel -->
    <div class="gallery">
      <div class="carousel">
        <div class="scroller" #scroller (scroll)="onScrollerScroll()">
          <figure class="slide" *ngFor="let img of images; index as i; trackBy: trackByIndex">
            <img class="hero" [src]="img" [alt]="product.name + ' - image ' + (i + 1)" />
          </figure>
        </div>

        <button class="nav prev" type="button" (click)="prev()" [disabled]="images.length <= 1">‹</button>
        <button class="nav next" type="button" (click)="next()" [disabled]="images.length <= 1">›</button>

        <div class="dots" *ngIf="images.length > 1">
          <button
            class="dot"
            *ngFor="let _ of images; index as i; trackBy: trackByIndex"
            type="button"
            (click)="scrollTo(i)"
            [class.active]="i === activeIndex"
          ></button>
        </div>
      </div>
    </div>

    <!-- 1/3 : Infos + commande -->
    <aside class="panel">
      <div class="price">
        <div class="price-label">Prix</div>
        <div class="price-value">{{ product.price | currency:'EUR' }}</div>
      </div>

      <div class="meta">
        <div class="meta-row">
          <span class="k">Stock</span>
          <span class="v" [class.bad]="isOutOfStock">
            {{ isOutOfStock ? 'Rupture' : (product.stock + ' disponibles') }}
          </span>
        </div>

        <div class="meta-row">
          <span class="k">Catégorie</span>
          <span class="v">{{ product.categoryId }}</span>
        </div>
      </div>

      <div class="qty">
        <div class="qty-label">Quantité</div>

        <div class="qty-control">
          <button type="button" class="qty-btn" (click)="decQty()" [disabled]="isOutOfStock || qty <= 1">−</button>

          <input
            class="qty-input"
            type="number"
            [(ngModel)]="qty"
            (blur)="clampQty()"
            [min]="isOutOfStock ? 0 : 1"
            [max]="maxQty"
            [disabled]="isOutOfStock"
          />

          <button type="button" class="qty-btn" (click)="incQty()" [disabled]="isOutOfStock || qty >= maxQty">+</button>
        </div>

        <div class="qty-hint" *ngIf="!isOutOfStock">Max: {{ maxQty }}</div>
      </div>

      <div class="total">
        <span>Total</span>
        <strong>{{ total | currency:'EUR' }}</strong>
      </div>

      <button class="cta" type="button" (click)="onAddToCart()" [disabled]="isOutOfStock">
        Add to cart
      </button>

      <div class="note" *ngIf="isOutOfStock">Produit indisponible pour le moment.</div>
    </aside>
  </div>
</section>
