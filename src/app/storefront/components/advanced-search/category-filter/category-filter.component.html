<div class="field">
  <label class="field__label" for="category-filter-select">Categories</label>
  <nz-select
    id="category-filter-select"
    class="field__select"
    nzMode="multiple"
    nzPlaceHolder="Select categories"
    [ngModel]="selectedIds()"
    (ngModelChange)="onSelectionChange($event)"
  >
    @for (category of categories(); track category.id) {
      <nz-option [nzLabel]="category.name" [nzValue]="category.id"></nz-option>
    }
  </nz-select>
</div>
