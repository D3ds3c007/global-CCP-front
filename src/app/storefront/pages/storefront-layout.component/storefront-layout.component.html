<main class="storefront">
  <div class="storefront__shell">
    <div class="storefront__container">
      <aside class="storefront__filters" aria-label="Advanced product filters">
        @if (categories$ | async; as categories) {
          <app-advanced-search-panel
            [categories]="categories"
            [query]="query()"
            (queryChange)="onQueryChange($event)"
            (clearFilters)="onClearFilters()"
          ></app-advanced-search-panel>
        }
      </aside>

      <section class="storefront__content">
        <ng-content></ng-content>
      </section>
    </div>
  </div>

  <app-floating-actions></app-floating-actions>
</main>
