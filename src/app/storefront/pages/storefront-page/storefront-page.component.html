<app-storefront-layout class="store__content">
      <section class="storefront__results">
        @if (topProducts$ | async; as topProducts) {
          <app-top-products-section
            [products]="topProducts"
            [addingProductId]="addingProductId()"
            [addedProductId]="addedProductId()"
            (addToCart)="onAddToCart($event)"
          ></app-top-products-section>
        }
      </section>

      <section class="storefront__results">
        <div class="results__header">
          <h2>All products</h2>
          @if (loading()) {
            <span class="results__status">Loading...</span>
          }
        </div>

        @if (error()) {
          <div class="results__error" role="alert">{{ error() }}</div>
        }

        @if (products$ | async; as products) {
          <app-product-grid
            [products]="products"
            [addingProductId]="addingProductId()"
            [addedProductId]="addedProductId()"
            (addToCart)="onAddToCart($event)"
          ></app-product-grid>
        }

        @if (totalItems$ | async; as totalItems) {
          <app-pagination
            [pageIndex]="pageIndex()"
            [pageSize]="pageSize()"
            [totalItems]="totalItems"
            (pageChange)="onPageChange($event)"
          ></app-pagination>
        }
    </section>
</app-storefront-layout>
